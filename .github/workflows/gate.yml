name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: CMaintz/foundry/.github/workflows/gate.yml@v2.11.0   # the public facade - pin this, not the per-stack files
    with:
      stack: "ts"
      working_directory: "."
