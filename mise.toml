# Foundry verb interface - TypeScript / Node template.
# Copy to a repo's mise.toml and adjust the tool versions. See CONTRACT.md.

[tools]
node = "22.14.0" # pin to whatever the repo actually uses
# deno = "2.9.7"  # uncomment if the repo has Deno code (see FOUNDRY_DENO_PATHS below)

[env]
# habit-hooks (structural-smell detector) is a pinned, mise-managed dependency, so the
# SAME version runs in-loop (Stop hook), pre-push (`gate`) and in CI. It's a pip tool,
# not a clean [tools] entry, so it's provisioned into a per-plugin venv by setup:habit-hooks
# (postinstall) whose bin goes on PATH below - mirroring how java.toml pins PMD. The core
# and its language plugin ship in lockstep, so both pin to this one version. Renovate bumps
# it (presets/renovate.json has the mise.toml customManager); keep it == the reusable
# workflow's `habit_hooks_version` default (1.5.0).
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-typescript"

# Put local binaries on PATH so tasks call `eslint`, not `npx eslint`; the habit-hooks venv
# bin (Linux `bin/`, Windows `Scripts/` - a missing one on PATH is harmless); and the repo's
# scripts/ so the gate can call `foundry-verb-wrap` by name (foundry-init installs it).
_.path = [
    "./node_modules/.bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{config_root}}/scripts",
]

# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Gitignore `.foundry/`. Read it with `foundry-loop-report`. The gate calls
# `foundry-verb-wrap` (installed by foundry-init, on PATH via scripts/ above).
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# Deno code to type-check with `deno check` in `typecheck` (space-separated dirs/files,
# relative to this file), e.g. Supabase Edge Functions incl. their _shared/ modules.
# FOUNDRY_DENO_PATHS = "supabase/functions"

# ── FOUNDRY_SINCE - changed-scope for the fast placements ────────────────────
# A git ref (empty ⇒ origin/main). When SET, the file-local verbs (`lint`, `test`)
# restrict work to files changed since its merge-base with HEAD - for the in-loop
# Stop hook and pre-push, where speed matters. When UNSET (CI, and the final
# `/ship` gate), they run whole-tree. Whole-program checks (`typecheck`) ignore it
# and always run whole-tree - a changed file can break an unchanged one. This is
# execute-scope, safe only because whole-tree CI is the authoritative backstop.
# See designs/changed-scope-gate.md. An unresolvable ref falls back to whole-tree
# (never skips). The signal is opt-in per verb; callers MUST NOT require it.

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)
# LEASH_ENABLED = "0"                 # 1 runs Leash turn checks (repos with the leash.sh hook)

[hooks]
# Provision the pinned habit-hooks on `mise install` (local and CI alike), like setup:pmd.
postinstall = "mise run setup:habit-hooks"

[tasks.fix]
description = "Auto-fix what is mechanically fixable; never opinionated"
# No formatter or linter is wired in this repo yet, so there is nothing to auto-fix.
run = "echo 'fix: no auto-fixer configured (no eslint/prettier in this repo)'"

# Provision the pinned habit-hooks (core + language plugin, same version) into a
# per-plugin venv. Auxiliary (tier c), like setup:pmd - not a contract verb, not in
# `gate` directly; it runs via the postinstall hook on `mise install`. Per-plugin dir
# so a multi-stack machine never reuses the ts venv for a java repo (wrong plugin).
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + language plugin into a venv (smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells, folded into `lint` below (tier b - verb composition, like novar).
# This is the same check CI's habits job runs; running it in `lint` makes `gate` the
# same oracle locally as in CI. It calls the pinned venv binary by its full path (not
# `habit-hooks` from PATH): mise APPENDS _.path, so an unpinned global install would
# otherwise shadow the pin - calling the venv directly is what makes the version pin real.
# --branch scopes to files changed vs the ratchet base (FOUNDRY_BASE_REF, default
# origin/main; CI sets the PR base SHA) - unchanged files are already covered by the snooze
# baseline. Degrades gracefully: skip when there's no .habit-hooks config or snooze
# baseline, or the base can't be resolved. It only FAILS hard when a config + baseline
# exist but the pinned habit-hooks is missing - a broken setup (run `mise install`), and
# CONTRACT says divergence is a bug, not a thing to skip.
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

[tasks.lint]
description = "Syntax check of the .mjs sources plus structural smells; non-mutating"
# No eslint in this repo. `node --check` is a real syntax check; smells run via habit-hooks.
run = [
    "git ls-files -z -- '*.mjs' '*.js' '*.cjs' | xargs -0 -r -n1 node --check",
    "mise run smells",
]

[tasks.typecheck]
description = "Static types (n/a: plain JavaScript, no TypeScript in this repo)"
# There is no TypeScript here and no tsconfig, so there is nothing to type-check. This is an
# explicit no-op, not a pass: add a tsconfig and `tsc -b` here when .ts or checkJs is adopted.
run = "echo 'typecheck: n/a - no TypeScript in this repo (plain .mjs); nothing to check'"

[tasks.test]
description = "Tests (node --test)"
run = "node --test tools/inventory/test/inventory.test.mjs tools/reorg/test/move.test.mjs"

[tasks.audit]
description = "Dependency vulnerabilities. Local subset; CI security.yml adds gitleaks + SAST"
# Ratcheted npm audit: fails on any critical NOT in .audit-allowlist.json, and on stale
# allowlist entries - so accepted CVE debt can only shrink, exactly like eslint
# suppressions or the habit-hooks snooze baseline. npm audit has no native per-advisory
# ignore, so this is how you accept ONE genuinely-unfixable critical with justification
# without silencing the whole check. With no allowlist file it behaves like plain
# `npm audit --audit-level=critical` (fails on any critical). Prefer fixing (npm audit
# fix, or a targeted `overrides` entry) over accepting. Use a repo-relative script path,
# not {{config_root}}: on Windows config_root has backslashes that bash strips, so the node
# path would break. The pipe hands the script npm's JSON so `npm` resolves in the shell.
run = "npm audit --json | node scripts/npm-audit-ratchet.mjs --level=critical --allowlist=.audit-allowlist.json"

# Architecture fitness (opt-in, tier-c auxiliary until you adopt it). Enforces YOUR
# layer map + no cycles via dependency-cruiser (needs `dependency-cruiser` installed).
# Whole-graph, so NOT changed-scoped - a cycle can be formed by an unrelated edge.
# To adopt: fill the layer map in .dependency-cruiser.cjs (from presets/arch/), generate
# the shrink-only baseline once, then fold `mise run arch` into `lint`. Walkthrough:
# presets/arch/SETUP.md; design: docs/designs/arch-fitness.md. Architecture-agnostic -
# hexagonal is just the default map.
[tasks.arch]
description = "Architecture fitness: no cross-layer imports, no cycles (dependency-cruiser)"
run = '''
set -eu
cfg=".dependency-cruiser.cjs"
base=".dependency-cruiser-known-violations.json"
if [ ! -f "$cfg" ]; then echo "arch: no $cfg yet - copy presets/arch/ and fill your layer map"; exit 0; fi
if [ -f "$base" ]; then
  exec depcruise src --config "$cfg" --ignore-known "$base"
fi
exec depcruise src --config "$cfg"
'''

[tasks.gate]
description = "The authoritative composite - the oracle. Nothing merges without this green."
# Array form runs sequentially. Do NOT use `depends`: mise runs dependencies in
# parallel with no ordering guarantee, which makes gate output unreadable and
# hides which check failed first.
# Each verb is wrapped by `foundry-verb-wrap`, which times it, appends one JSONL line
# to FOUNDRY_TELEMETRY, then propagates the verb's exit code unchanged - telemetry
# never changes the outcome, and a failing verb still stops the sequence. Read the log
# with `foundry-loop-report`. The wrapper is required (foundry-init installs it, on
# PATH via scripts/ - see [env]); it is NOT on the six-verb contract.
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
